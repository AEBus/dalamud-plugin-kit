name: Self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Command line
        run: python3 -m d17 --help
